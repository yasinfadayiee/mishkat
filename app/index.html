<!doctype html>
<html lang="fa" dir="rtl" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf6ea" />
    <meta name="description" content="مشکات — آموزش ساده و مستند قرآن، نهج‌البلاغه و احادیث برای زندگی روزمره" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="مشکات" />
    <link rel="icon" type="image/png" href="icons/icon-64.png" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>مشکات</title>
    <!-- قلم‌های صفحهٔ خانه و فایل‌های امروز پیش از اجرای برنامه گرفته می‌شوند -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-400-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-900-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/amiri/files/amiri-arabic-400-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/amiri-quran/files/amiri-quran-arabic-400-normal.woff2" />
    <script>
      ;(function () {
        try {
          var day = Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000) % 365
          ;['books/index.json', 'books/daily/' + Math.floor(day / 30) + '.json'].forEach(function (h) {
            var l = document.createElement('link')
            l.rel = 'preload'
            l.as = 'fetch'
            l.crossOrigin = 'anonymous'
            l.href = h
            document.head.appendChild(l)
          })
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
