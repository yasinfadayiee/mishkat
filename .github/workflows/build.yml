# نسخهٔ وب را از کد منبع می‌سازد و خروجی را روی شاخهٔ gh-pages می‌گذارد.
# سایتِ منتشرشده تا وقتی منبع انتشار GitHub Pages دستی عوض نشود، همان شاخهٔ main می‌ماند.
name: build-web
on:
  push:
    branches: [redesign]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-web
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app
      # پوشهٔ books از متن‌های منبع (corpus) و ترجمه‌ها و شرح‌ها (content) ساخته می‌شود
      - run: node scripts/build-books.mjs
      - run: npm run build --prefix app
      - name: Publish dist to gh-pages
        run: |
          cd app/dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Build ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
