<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><style>
@font-face{font-family:Vazirmatn;font-weight:400;src:url(../../assets/vazirmatn-arabic-400-normal-DMZFCm7K.woff2)}
@font-face{font-family:Vazirmatn;font-weight:700;src:url(../../assets/vazirmatn-arabic-700-normal-Dge_DOjm.woff2)}
*{box-sizing:border-box;margin:0}body{font-family:Vazirmatn;background:#d9d6cf;padding:28px;display:flex;gap:28px;width:max-content;align-items:flex-start}
.phone{width:390px;height:700px;border-radius:38px;padding:70px 26px 0;background:linear-gradient(160deg,#c9d6df,#e9dcc9 55%,#d7c3b0);box-shadow:0 20px 50px #0003;direction:rtl}
.grid{display:grid;grid-template-columns:repeat(4,60px);justify-content:space-between;row-gap:24px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:#222;width:60px;white-space:nowrap}
.app img,.app i{width:60px;height:60px;border-radius:13.5px;display:block}.app i{background:#fff8;}
.app b{font-weight:400}.hl b{font-weight:700}
.panel{background:#fff;border-radius:24px;padding:24px;direction:rtl;width:560px}
h3{font-size:15px;margin-bottom:14px}table{border-collapse:collapse;width:100%}td{padding:10px 8px;text-align:center;vertical-align:middle;font-size:12.5px;color:#444;border-top:1px solid #eee}
td img{display:block;margin:auto}.big{width:112px;height:112px;border-radius:25px}.r{border-radius:22%}.c{border-radius:50%}
th{font-size:12px;color:#777;font-weight:400;padding-bottom:6px}
</style><body>
<div class="phone"><div class="grid">
<div class="app"><i></i><b>تقویم</b></div><div class="app"><i></i><b>دوربین</b></div><div class="app"><i></i><b>نقشه</b></div><div class="app"><i></i><b>پیام‌ها</b></div>
<div class="app hl"><img src="../../icons/icon-192.png"><b>فعلی</b></div><div class="app hl"><img src="1-taq.svg"><b>۱ · طاق</b></div><div class="app hl"><img src="2-qandil.svg"><b>۲ · قندیل</b></div><div class="app hl"><img src="3-shamsa.svg"><b>۳ · شمسه</b></div>
<div class="app hl"><img src="4-ketab.svg"><b>۴ · کتاب</b></div><div class="app"><i></i><b>یادداشت</b></div><div class="app"><i></i><b>ساعت</b></div><div class="app"><i></i><b>تنظیمات</b></div>
<div class="app"><i></i><b>موسیقی</b></div><div class="app"><i></i><b>عکس‌ها</b></div><div class="app"><i></i><b>هوا</b></div><div class="app"><i></i><b>فایل‌ها</b></div>
</div></div>
<div class="panel"><h3>همان طرح‌ها در اندازه‌های دیگر</h3><table>
<tr><th></th><th>بزرگ</th><th>اندروید (دایره)</th><th>۳۲px</th><th>۱۶px (favicon)</th></tr>
<tr><td>فعلی</td><td><img class="big" src="../../icons/icon-512.png"></td><td><img class="c" width="60" src="../../icons/icon-192.png"></td><td><img class="r" width="32" src="../../icons/icon-64.png"></td><td><img class="r" width="16" src="../../icons/icon-32.png"></td></tr>
<tr><td>۱ · طاق و شعله</td><td><img class="big" src="1-taq.svg"></td><td><img class="c" width="60" src="1-taq.svg"></td><td><img class="r" width="32" src="1-taq.svg"></td><td><img class="r" width="16" src="1-taq.svg"></td></tr>
<tr><td>۲ · قندیل</td><td><img class="big" src="2-qandil.svg"></td><td><img class="c" width="60" src="2-qandil.svg"></td><td><img class="r" width="32" src="2-qandil.svg"></td><td><img class="r" width="16" src="2-qandil.svg"></td></tr>
<tr><td>۳ · شمسه و نور</td><td><img class="big" src="3-shamsa.svg"></td><td><img class="c" width="60" src="3-shamsa.svg"></td><td><img class="r" width="32" src="3-shamsa.svg"></td><td><img class="r" width="16" src="3-shamsa.svg"></td></tr>
<tr><td>۴ · کتاب روشن</td><td><img class="big" src="4-ketab.svg"></td><td><img class="c" width="60" src="4-ketab.svg"></td><td><img class="r" width="32" src="4-ketab.svg"></td><td><img class="r" width="16" src="4-ketab.svg"></td></tr>
</table></div></body></html>
